{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.controlPlaneTo }}
{{- fail "networkPolicy.controlPlaneTo is required when networkPolicy.enabled is true" }}
{{- end }}
{{- if not .Values.networkPolicy.apiServerCIDRs }}
{{- fail "networkPolicy.apiServerCIDRs is required when networkPolicy.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- toYaml .Values.networkPolicy.controlPlaneTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.controlPlanePort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
