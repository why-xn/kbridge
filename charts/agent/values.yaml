replicaCount: 1

image:
  repository: ghcr.io/why-xn/kbridge-agent
  tag: v0.3.0-alpha.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

controlPlane:
  # gRPC address of the control plane (in-cluster Service DNS or external host).
  url: "kbridge-control-plane:9090"
  token: "change-me"
  # When set, mount this existing Secret and use KBRIDGE_AGENT_TOKEN_FILE instead
  # of rendering the token inline in the config Secret.
  existingSecret: ""
  tls:
    enabled: false
    insecure: false
    # PEM-encoded CA certificate to verify the control plane server. Mounted when set.
    caCert: ""

cluster:
  name: "my-cluster"
  kubernetesVersion: ""
  nodeCount: 0
  region: ""
  provider: ""

podSecurityContext:
  runAsNonRoot: true
  # Group of the agent user (uid 10001) so it can read the 0400 projected token files.
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""

rbac:
  # The agent's ClusterRole grants impersonation, plus what it needs to keep
  # kbridge:<email> users bound as kbridge policy (clusterAccess) says, within
  # accessCeiling below.
  create: true

# The most kbridge may hand out in THIS cluster, whatever its policy says. The
# agent creates the bindings kbridge policy clusterAccess asks for, and
# Kubernetes refuses (403) any binding to a ClusterRole not listed here, in a
# namespace not listed here, or cluster-wide unless clusterWide is true; see
# `kb admin rbac status`. The defaults let a kbridge admin be cluster-admin.
# To limit what any kbridge policy can grant here, lower it, for example
# clusterRoles: [view, edit] and clusterWide: false. The agent itself never
# writes in the release namespace or protectedNamespaces.
accessCeiling:
  clusterRoles: [view, edit, cluster-admin]  # ClusterRoles kbridge may bind
  namespaces: []               # empty = any namespace except the protected ones
  clusterWide: true            # allow ClusterRoleBindings

# Namespaces the agent refuses to touch. The release namespace is always
# protected; add the control plane's namespace when it runs in this cluster.
protectedNamespaces: []

# How often the agent re-checks its bindings against kbridge policy when nothing
# else triggers a sync (a policy change or a binding edit does at once).
sync:
  interval: 60s

# The agent's own ServiceAccount token is projected at /var/run/kbridge/sa
# (not the default path, which is left unmounted) and rotated by the kubelet.
serviceAccountToken:
  expirationSeconds: 600

# Optional egress lock-down: the agent may only reach the API server, the
# control plane and cluster DNS. Recommended; both lists below are required.
networkPolicy:
  enabled: false
  # API server endpoint IPs, e.g. from `kubectl get endpoints kubernetes`.
  apiServerCIDRs: []
  apiServerPorts: [443, 6443]
  # NetworkPolicyPeer list for the control plane, e.g. [{ipBlock: {cidr: 203.0.113.10/32}}].
  controlPlaneTo: []
  controlPlanePort: 9090

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
