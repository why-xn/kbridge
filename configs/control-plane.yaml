server:
  http_port: 8080
  grpc_port: 9090

database:
  driver: sqlite
  path: kbridge.db

auth:
  jwt_secret: "REPLACE_ME"   # REQUIRED: generate with `openssl rand -hex 32`
  token_pepper: ""                 # HMAC key for agent tokens at rest; empty = reuse jwt_secret
  access_token_expiry: 24h
  refresh_token_expiry: 168h
  admin_email: admin@kbridge.local
  admin_password: admin123
  admin_name: Admin

audit:
  retention_days: 90
  cleanup_interval: 24h

# bootstrap optionally seeds an agent token on startup for local development.
# Leave empty in production and create agent tokens via the admin API
# (POST /api/v1/admin/agent-tokens) instead.
bootstrap:
  agent_token: "dev-token"
  agent_cluster: "dev-cluster"

# rbac points at a declarative policy file (hot-reloaded on change). Leave
# policy_file empty to disable enforcement (all authenticated users allowed).
rbac:
  policy_file: "configs/rbac.yaml"

# tls secures both the HTTP and gRPC servers with the same certificate.
# Generate a dev cert with `make certs`. Disabled by default.
tls:
  enabled: false
  cert_file: "certs/tls.crt"
  key_file: "certs/tls.key"

# grants bounds just-in-time access. A require-approval guardrail is satisfied
# only by an approved grant, and every grant expires on its own.
grants:
  max_duration: 8h        # ceiling on any single grant
  default_duration: 1h    # used when a request names no duration
  allow_self_approval: false  # a second pair of eyes is the point
  # notify tells people a request exists. Without it, a request waits for an
  # admin to run `kb admin grants list`. Each entry is one webhook.
  notify: []
  #  - url: https://hooks.slack.com/services/T000/B000/xxxx
  #    format: slack               # slack | google-chat | json
  #  - url: https://automation.example.com/kbridge
  #    format: json
  #    secret: "REPLACE_ME"        # json only: HMAC-SHA256 in X-Kbridge-Signature
  #    events: [grant-requested]   # default: every lifecycle event

# streams bounds concurrent streaming sessions (kubectl logs -f, get -w).
streams:
  max_concurrent: 50
